<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>자재단가 대시보드</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-soft: #eef3f8;
      --ink: #172033;
      --muted: #667085;
      --line: #d8e0ea;
      --blue: #2563eb;
      --green: #0f8b62;
      --amber: #b7791f;
      --red: #c2412d;
      --shadow: 0 10px 24px rgba(23, 32, 51, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", "Noto Sans KR", Arial, sans-serif;
      letter-spacing: 0;
    }

    .app-shell {
      width: min(1440px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: end;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 760;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .source-pill {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 6px;
      padding: 10px 12px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(5, minmax(150px, 1fr)) auto;
      gap: 12px;
      align-items: end;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    select,
    button {
      width: 100%;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 14px;
    }

    select { padding: 0 10px; }

    button {
      padding: 0 14px;
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
      cursor: pointer;
      font-weight: 700;
    }

    button:hover { background: #263248; }

    .kpis {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .kpi {
      min-height: 112px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: var(--shadow);
      display: grid;
      align-content: space-between;
      gap: 8px;
    }

    .kpi span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .kpi strong {
      display: block;
      font-size: 25px;
      line-height: 1.18;
      overflow-wrap: anywhere;
    }

    .kpi small {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      min-height: 17px;
    }

    .charts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .panel h2 {
      margin: 0 0 12px;
      font-size: 16px;
      line-height: 1.3;
    }

    .chart-frame {
      position: relative;
      height: 300px;
    }

    .table-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .table-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }

    .table-head h2 {
      margin: 0;
      font-size: 16px;
    }

    .table-head p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .table-scroll {
      overflow: auto;
      max-height: 470px;
    }

    table {
      width: 100%;
      min-width: 920px;
      border-collapse: collapse;
      font-size: 13px;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      white-space: nowrap;
    }

    th {
      position: sticky;
      top: 0;
      background: var(--surface-soft);
      z-index: 1;
      color: #344054;
      font-size: 12px;
    }

    td.num,
    th.num { text-align: right; }

    tbody tr:hover { background: #f8fafc; }

    .empty {
      padding: 32px 16px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 1100px) {
      .filters { grid-template-columns: repeat(3, minmax(150px, 1fr)); }
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .charts { grid-template-columns: 1fr; }
    }

    @media (max-width: 720px) {
      .app-shell { width: min(100% - 20px, 1440px); padding-top: 18px; }
      header { grid-template-columns: 1fr; }
      h1 { font-size: 23px; }
      .source-pill { white-space: normal; }
      .filters { grid-template-columns: 1fr; padding: 12px; }
      .kpis { grid-template-columns: 1fr; }
      .chart-frame { height: 260px; }
      .table-head { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header>
      <div>
        <h1>자재단가 대시보드</h1>
        <p class="subtitle">2022년부터 2024년까지의 자재 단가, 발주수량, 공급업체별 흐름을 필터로 탐색합니다.</p>
      </div>
      <div class="source-pill">자재단가_2022-2024.csv · <span id="sourceCount">302</span>행</div>
    </header>

    <section class="filters" aria-label="대시보드 필터">
      <label>시작월
        <select id="startDate"></select>
      </label>
      <label>종료월
        <select id="endDate"></select>
      </label>
      <label>카테고리
        <select id="categoryFilter"></select>
      </label>
      <label>자재명
        <select id="materialFilter"></select>
      </label>
      <label>공급업체
        <select id="vendorFilter"></select>
      </label>
      <button id="resetButton" type="button">초기화</button>
    </section>

    <section class="kpis" aria-label="핵심 지표">
      <article class="kpi">
        <span>평균 단가</span>
        <strong id="avgPrice">-</strong>
        <small id="avgPriceSub">필터 적용 기준</small>
      </article>
      <article class="kpi">
        <span>총 발주수량</span>
        <strong id="totalQty">-</strong>
        <small id="totalQtySub">전체 합계</small>
      </article>
      <article class="kpi">
        <span>최고 단가 자재</span>
        <strong id="topMaterial">-</strong>
        <small id="topMaterialSub">-</small>
      </article>
      <article class="kpi">
        <span>단가 변동폭 최대</span>
        <strong id="volatileMaterial">-</strong>
        <small id="volatileMaterialSub">-</small>
      </article>
    </section>

    <section class="charts" aria-label="시각화 차트">
      <article class="panel">
        <h2>월별 평균 단가 추이</h2>
        <div class="chart-frame"><canvas id="monthlyChart"></canvas></div>
      </article>
      <article class="panel">
        <h2>카테고리별 평균 단가</h2>
        <div class="chart-frame"><canvas id="categoryChart"></canvas></div>
      </article>
      <article class="panel">
        <h2>공급업체별 발주수량</h2>
        <div class="chart-frame"><canvas id="vendorChart"></canvas></div>
      </article>
      <article class="panel">
        <h2>자재별 단가 변동폭 Top 10</h2>
        <div class="chart-frame"><canvas id="volatilityChart"></canvas></div>
      </article>
    </section>

    <section class="table-panel" aria-label="필터링된 데이터">
      <div class="table-head">
        <div>
          <h2>상세 데이터</h2>
          <p>단가 높은 순으로 정렬됩니다.</p>
        </div>
        <p id="tableSummary">-</p>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>날짜</th>
              <th>자재코드</th>
              <th>자재명</th>
              <th>카테고리</th>
              <th class="num">단가</th>
              <th>공급업체</th>
              <th class="num">발주수량</th>
              <th>비고</th>
            </tr>
          </thead>
          <tbody id="dataBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const rawData = JSON.parse(document.getElementById('material-data').textContent);
    const data = rawData.map((row) => ({
      ...row,
      unitPrice: Number(row.unitPrice),
      orderQty: Number(row.orderQty)
    }));

    const won = new Intl.NumberFormat('ko-KR', { style: 'currency', currency: 'KRW', maximumFractionDigits: 0 });
    const countFmt = new Intl.NumberFormat('ko-KR');
    const palette = ['#2563eb', '#0f8b62', '#b7791f', '#c2412d', '#6b5dd3', '#0e7490', '#9f1239', '#475569', '#4d7c0f', '#be185d'];

    const filters = {
      startDate: document.getElementById('startDate'),
      endDate: document.getElementById('endDate'),
      category: document.getElementById('categoryFilter'),
      material: document.getElementById('materialFilter'),
      vendor: document.getElementById('vendorFilter')
    };

    const charts = {};

    function uniqueSorted(field) {
      return [...new Set(data.map((row) => row[field]).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ko'));
    }

    function fillSelect(select, values, allLabel) {
      select.innerHTML = '';
      const all = document.createElement('option');
      all.value = 'ALL';
      all.textContent = allLabel;
      select.appendChild(all);
      values.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      });
    }

    function fillDateSelect(select, values) {
      select.innerHTML = '';
      values.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      });
    }

    function groupBy(rows, key) {
      return rows.reduce((acc, row) => {
        const value = typeof key === 'function' ? key(row) : row[key];
        if (!acc.has(value)) acc.set(value, []);
        acc.get(value).push(row);
        return acc;
      }, new Map());
    }

    function average(rows, field) {
      if (!rows.length) return 0;
      return rows.reduce((sum, row) => sum + row[field], 0) / rows.length;
    }

    function filteredRows() {
      const start = filters.startDate.value;
      const end = filters.endDate.value;
      return data.filter((row) => {
        return row.date >= start &&
          row.date <= end &&
          (filters.category.value === 'ALL' || row.category === filters.category.value) &&
          (filters.material.value === 'ALL' || row.materialName === filters.material.value) &&
          (filters.vendor.value === 'ALL' || row.vendor === filters.vendor.value);
      });
    }

    function buildLineDataset(rows) {
      const grouped = groupBy(rows, 'date');
      const labels = [...grouped.keys()].sort();
      return {
        labels,
        values: labels.map((label) => Math.round(average(grouped.get(label), 'unitPrice')))
      };
    }

    function buildAverageBy(rows, field) {
      const grouped = groupBy(rows, field);
      return [...grouped.entries()]
        .map(([label, items]) => ({ label, value: Math.round(average(items, 'unitPrice')) }))
        .sort((a, b) => b.value - a.value);
    }

    function buildSumBy(rows, field) {
      const grouped = groupBy(rows, field);
      return [...grouped.entries()]
        .map(([label, items]) => ({ label, value: items.reduce((sum, row) => sum + row.orderQty, 0) }))
        .sort((a, b) => b.value - a.value);
    }

    function buildVolatility(rows) {
      const grouped = groupBy(rows, 'materialName');
      return [...grouped.entries()]
        .map(([label, items]) => {
          const prices = items.map((row) => row.unitPrice);
          const min = Math.min(...prices);
          const max = Math.max(...prices);
          return { label, value: max - min, min, max };
        })
        .filter((item) => Number.isFinite(item.value))
        .sort((a, b) => b.value - a.value)
        .slice(0, 10);
    }

    function chartOptions(valueFormatter) {
      return {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (context) => valueFormatter(context.parsed.y ?? context.parsed.x)
            }
          }
        },
        scales: {
          x: { grid: { display: false }, ticks: { maxRotation: 0, autoSkip: true } },
          y: { beginAtZero: true, ticks: { callback: (value) => valueFormatter(value) } }
        }
      };
    }

    function createOrUpdateChart(id, config) {
      if (!window.Chart) return;
      if (charts[id]) {
        charts[id].data = config.data;
        charts[id].options = config.options;
        charts[id].update();
        return;
      }
      charts[id] = new Chart(document.getElementById(id), config);
    }

    function updateKpis(rows) {
      const avgPrice = rows.length ? Math.round(average(rows, 'unitPrice')) : 0;
      const totalQty = rows.reduce((sum, row) => sum + row.orderQty, 0);
      const topRow = rows.reduce((best, row) => !best || row.unitPrice > best.unitPrice ? row : best, null);
      const volatility = buildVolatility(rows)[0];

      document.getElementById('avgPrice').textContent = rows.length ? won.format(avgPrice) : '-';
      document.getElementById('avgPriceSub').textContent = `${countFmt.format(rows.length)}건 기준`;
      document.getElementById('totalQty').textContent = rows.length ? countFmt.format(totalQty) : '-';
      document.getElementById('totalQtySub').textContent = '필터 결과 발주수량 합계';
      document.getElementById('topMaterial').textContent = topRow ? topRow.materialName : '-';
      document.getElementById('topMaterialSub').textContent = topRow ? `${topRow.date} · ${won.format(topRow.unitPrice)} · ${topRow.vendor}` : '-';
      document.getElementById('volatileMaterial').textContent = volatility ? volatility.label : '-';
      document.getElementById('volatileMaterialSub').textContent = volatility ? `${won.format(volatility.min)} ~ ${won.format(volatility.max)}` : '-';
    }

    function updateCharts(rows) {
      const monthly = buildLineDataset(rows);
      const categories = buildAverageBy(rows, 'category');
      const vendors = buildSumBy(rows, 'vendor');
      const volatility = buildVolatility(rows);

      createOrUpdateChart('monthlyChart', {
        type: 'line',
        data: {
          labels: monthly.labels,
          datasets: [{
            data: monthly.values,
            borderColor: '#2563eb',
            backgroundColor: 'rgba(37, 99, 235, 0.12)',
            fill: true,
            tension: 0.28,
            pointRadius: 3,
            pointHoverRadius: 5
          }]
        },
        options: chartOptions((value) => won.format(value))
      });

      createOrUpdateChart('categoryChart', {
        type: 'bar',
        data: {
          labels: categories.map((item) => item.label),
          datasets: [{ data: categories.map((item) => item.value), backgroundColor: palette }]
        },
        options: chartOptions((value) => won.format(value))
      });

      createOrUpdateChart('vendorChart', {
        type: 'bar',
        data: {
          labels: vendors.map((item) => item.label),
          datasets: [{ data: vendors.map((item) => item.value), backgroundColor: '#0f8b62' }]
        },
        options: chartOptions((value) => countFmt.format(value))
      });

      createOrUpdateChart('volatilityChart', {
        type: 'bar',
        data: {
          labels: volatility.map((item) => item.label),
          datasets: [{ data: volatility.map((item) => item.value), backgroundColor: '#b7791f' }]
        },
        options: {
          ...chartOptions((value) => won.format(value)),
          indexAxis: 'y',
          scales: {
            x: { beginAtZero: true, ticks: { callback: (value) => won.format(value) } },
            y: { grid: { display: false } }
          }
        }
      });
    }

    function addCell(tr, value, className) {
      const td = document.createElement('td');
      td.textContent = value ?? '';
      if (className) td.className = className;
      tr.appendChild(td);
    }

    function updateTable(rows) {
      const body = document.getElementById('dataBody');
      const tableSummary = document.getElementById('tableSummary');
      body.innerHTML = '';
      tableSummary.textContent = `${countFmt.format(rows.length)}건 표시`;

      if (!rows.length) {
        const empty = document.createElement('tr');
        const td = document.createElement('td');
        td.className = 'empty';
        td.colSpan = 8;
        td.textContent = '조건에 맞는 데이터가 없습니다.';
        empty.appendChild(td);
        body.appendChild(empty);
        return;
      }

      rows
        .slice()
        .sort((a, b) => b.unitPrice - a.unitPrice || b.orderQty - a.orderQty)
        .forEach((row) => {
          const tr = document.createElement('tr');
          addCell(tr, row.date);
          addCell(tr, row.materialCode);
          addCell(tr, row.materialName);
          addCell(tr, row.category);
          addCell(tr, won.format(row.unitPrice), 'num');
          addCell(tr, row.vendor);
          addCell(tr, countFmt.format(row.orderQty), 'num');
          addCell(tr, row.note || '');
          body.appendChild(tr);
        });
    }

    function updateDashboard() {
      const rows = filteredRows();
      updateKpis(rows);
      updateCharts(rows);
      updateTable(rows);
    }

    function init() {
      const dates = uniqueSorted('date');
      fillDateSelect(filters.startDate, dates);
      fillDateSelect(filters.endDate, dates);
      filters.startDate.value = dates[0];
      filters.endDate.value = dates[dates.length - 1];
      fillSelect(filters.category, uniqueSorted('category'), '전체 카테고리');
      fillSelect(filters.material, uniqueSorted('materialName'), '전체 자재');
      fillSelect(filters.vendor, uniqueSorted('vendor'), '전체 공급업체');
      document.getElementById('sourceCount').textContent = countFmt.format(data.length);

      Object.values(filters).forEach((select) => select.addEventListener('change', () => {
        if (filters.startDate.value > filters.endDate.value) {
          const tmp = filters.startDate.value;
          filters.startDate.value = filters.endDate.value;
          filters.endDate.value = tmp;
        }
        updateDashboard();
      }));

      document.getElementById('resetButton').addEventListener('click', () => {
        filters.startDate.value = dates[0];
        filters.endDate.value = dates[dates.length - 1];
        filters.category.value = 'ALL';
        filters.material.value = 'ALL';
        filters.vendor.value = 'ALL';
        updateDashboard();
      });

      updateDashboard();
    }

    init();
  </script>
</body>
